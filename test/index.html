<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Test suite — Scale Practice Feedback</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    #summary { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 8px; }
    #summary.pass { background: #d9ecd9; color: #1a4d1a; }
    #summary.fail { background: #f6d9d3; color: #7a2418; }
    .case { padding: 0.4rem 0.6rem; border-radius: 6px; margin-bottom: 0.25rem; }
    .case.pass { color: #1a4d1a; }
    .case.fail { background: #f6d9d3; color: #7a2418; }
    .error { display: block; margin-top: 0.2rem; font-size: 0.85rem; opacity: 0.85; }
  </style>
</head>
<body>
  <h1>Test suite</h1>
  <p>No build step, no test runner installed — this page runs the same pure functions
     the app uses, against hand-checked synthetic MIDI events. Open it directly in any
     browser via a local static server (see README.md).</p>
  <div id="summary">running…</div>
  <div id="cases"></div>

  <script type="module">
    import "./tests.js";
    import { getResults, settle } from "./assert.js";

    await settle();
    const results = getResults();
    const passed = results.filter((r) => r.pass).length;
    const failed = results.length - passed;

    const summary = document.getElementById("summary");
    summary.className = failed === 0 ? "pass" : "fail";
    summary.textContent = failed === 0
      ? `ALL PASS — ${passed}/${results.length}`
      : `${failed} FAILING — ${passed}/${results.length} passed`;

    const container = document.getElementById("cases");
    results.forEach((r) => {
      const div = document.createElement("div");
      div.className = `case ${r.pass ? "pass" : "fail"}`;
      div.textContent = `${r.pass ? "✓" : "✗"} ${r.name}`;
      if (!r.pass) {
        const err = document.createElement("span");
        err.className = "error";
        err.textContent = r.error;
        div.appendChild(err);
      }
      container.appendChild(div);
    });
  </script>
</body>
</html>
